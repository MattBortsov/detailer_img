name: detailer-img

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  MINI_APP_URL: ${MINI_APP_URL:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-x-ai/grok-imagine-image-quality}
  MODERATION_VISION_MODEL: ${MODERATION_VISION_MODEL:-google/gemini-2.5-flash}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JOB_WAKEUP_CHANNEL: ${JOB_WAKEUP_CHANNEL:-car-wrap.jobs}
  JOB_RELAY_BATCH_SIZE: ${JOB_RELAY_BATCH_SIZE:-50}
  JOB_RELAY_POLL_SECONDS: ${JOB_RELAY_POLL_SECONDS:-2}
  JOB_MAX_ACTIVE_PER_USER: ${JOB_MAX_ACTIVE_PER_USER:-1}
  JOB_MAX_ACCEPTED_PER_WINDOW: ${JOB_MAX_ACCEPTED_PER_WINDOW:-10}
  JOB_LIMIT_WINDOW_SECONDS: ${JOB_LIMIT_WINDOW_SECONDS:-3600}
  JOB_WORKER_POLL_SECONDS: ${JOB_WORKER_POLL_SECONDS:-2}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-300}
  JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-30}
  GENERATION_PROMPT_REVISION: ${GENERATION_PROMPT_REVISION:-vehicle-wrap-v1}
  PROVIDER_MAX_OUTPUT_BYTES: ${PROVIDER_MAX_OUTPUT_BYTES:-20971520}
  PROVIDER_MAX_IMAGE_SIDE_PX: ${PROVIDER_MAX_IMAGE_SIDE_PX:-8192}
  PROVIDER_MAX_IMAGE_PIXELS: ${PROVIDER_MAX_IMAGE_PIXELS:-25000000}
  TELEGRAM_RESULT_MAX_BYTES: ${TELEGRAM_RESULT_MAX_BYTES:-9437184}
  TELEGRAM_RESULT_MAX_SIDE_SUM: ${TELEGRAM_RESULT_MAX_SIDE_SUM:-10000}
  OPENROUTER_CONNECT_TIMEOUT_SECONDS: ${OPENROUTER_CONNECT_TIMEOUT_SECONDS:-10}
  OPENROUTER_READ_TIMEOUT_SECONDS: ${OPENROUTER_READ_TIMEOUT_SECONDS:-180}
  OPENROUTER_WRITE_TIMEOUT_SECONDS: ${OPENROUTER_WRITE_TIMEOUT_SECONDS:-30}
  OPENROUTER_POOL_TIMEOUT_SECONDS: ${OPENROUTER_POOL_TIMEOUT_SECONDS:-10}
  ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS:-}
  CUSTOM_COLOR_STORAGE_ROOT: /var/lib/car-wrap/custom-colors
  CUSTOM_COLOR_MAX_BYTES: ${CUSTOM_COLOR_MAX_BYTES:-8388608}
  CUSTOM_COLOR_MAX_SIDE_PX: ${CUSTOM_COLOR_MAX_SIDE_PX:-8192}
  CUSTOM_COLOR_MAX_PIXELS: ${CUSTOM_COLOR_MAX_PIXELS:-20000000}
  CUSTOM_COLOR_MAX_FRAMES: "1"
  CUSTOM_COLOR_OUTPUT_LONG_EDGE_PX: ${CUSTOM_COLOR_OUTPUT_LONG_EDGE_PX:-2048}
  CUSTOM_COLOR_DECODE_TIMEOUT_SECONDS: ${CUSTOM_COLOR_DECODE_TIMEOUT_SECONDS:-15}
  CUSTOM_COLOR_QUOTA: ${CUSTOM_COLOR_QUOTA:-20}
  CLAMAV_SOCKET_PATH: /run/clamav/clamd.sock

x-app-image: &app-image
  image: detailer-img:${APP_IMAGE_TAG:-local}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-no-core-dumps: &no-core-dumps
  core:
    soft: 0
    hard: 0

services:
  redis:
    image: redis:8.0.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - backend
    mem_limit: 128m
    ulimits: *no-core-dumps
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_wrap}
      POSTGRES_USER: ${POSTGRES_USER:-car_wrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    mem_limit: 512m
    ulimits: *no-core-dumps
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clamav:
    image: clamav/clamav:1.4.5-debian13-slim
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sed -i '/^StreamMaxLength /d;/^ConcurrentDatabaseReload /d' /etc/clamav/clamd.conf
        printf '\nStreamMaxLength 8M\nConcurrentDatabaseReload no\n' >> /etc/clamav/clamd.conf
        sed -i '/^TestDatabases /d' /etc/clamav/freshclam.conf
        printf '\nTestDatabases no\n' >> /etc/clamav/freshclam.conf
        exec /init
    environment:
      CLAMD_STARTUP_TIMEOUT: "600"
      FRESHCLAM_CHECKS: "2"
    volumes:
      - clamav_database:/var/lib/clamav
      - clamav_socket:/tmp
    networks:
      - scanner_egress
    mem_limit: 2300m
    ulimits: *no-core-dumps
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - test -S /tmp/clamd.sock && clamdscan --ping=3
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  storage-init:
    <<: *app-image
    user: "0:0"
    command:
      - /usr/bin/install
      - -d
      - -m
      - "0700"
      - -o
      - "10001"
      - -g
      - "10001"
      - /var/lib/car-wrap/custom-colors
    volumes:
      - custom_color_data:/var/lib/car-wrap/custom-colors
    networks:
      - backend
    restart: "no"

  migrate:
    <<: *app-image
    command: ["python", "-m", "car_wrap.db.migrate"]
    environment: *app-environment
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment: *app-environment
    volumes:
      - custom_color_data:/var/lib/car-wrap/custom-colors
      - clamav_socket:/run/clamav:ro
    networks:
      - backend
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    mem_limit: 900m
    ulimits: *no-core-dumps
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8000/health/ready',
          headers={'X-Forwarded-Proto':'https'});
          raise SystemExit(0 if urllib.request.urlopen(r, timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    <<: *app-image
    command: ["python", "-m", "car_wrap.bot.main"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment: *app-environment
    volumes:
      - custom_color_data:/var/lib/car-wrap/custom-colors
      - clamav_socket:/run/clamav:ro
    networks:
      - backend
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    ulimits: *no-core-dumps
    logging: *default-logging

  relay:
    <<: *app-image
    command: ["python", "-m", "car_wrap.jobs.main"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment: *app-environment
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    ulimits: *no-core-dumps
    logging: *default-logging

  worker:
    <<: *app-image
    command: ["python", "-m", "car_wrap.worker.main"]
    restart: unless-stopped
    init: true
    stop_grace_period: 330s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment: *app-environment
    volumes:
      - custom_color_data:/var/lib/car-wrap/custom-colors:ro
    networks:
      - backend
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    mem_limit: 768m
    ulimits: *no-core-dumps
    logging: *default-logging

  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=4m,mode=0755
      - /var/log/nginx:size=16m,mode=0755
    volumes:
      - ./nginx/car-wrap.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - edge
    ports:
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    ulimits: *no-core-dumps
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --spider --no-check-certificate
          --header='Host: 89-167-101-93.sslip.io'
          https://127.0.0.1/health/live
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  clamav_database:
  clamav_socket:
  custom_color_data:

networks:
  backend:
    internal: true
  scanner_egress:
  edge:
