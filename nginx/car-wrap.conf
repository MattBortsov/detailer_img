pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format safe '$remote_addr - $host [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe;
    error_log /var/log/nginx/error.log warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    client_max_body_size 9m;
    client_body_timeout 20s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 60s;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    open_file_cache max=1000 inactive=1h;
    open_file_cache_valid 1h;
    open_file_cache_min_uses 2;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name 89-167-101-93.sslip.io;

        ssl_certificate /etc/letsencrypt/live/89-167-101-93.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/89-167-101-93.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_send_timeout 210s;
            proxy_read_timeout 210s;
            proxy_request_buffering on;
            proxy_buffering on;
        }

        location /health/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' blob:; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }
    }
}
