name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gate:
    name: Deployment gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject tracked secrets and image evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          tracked_sensitive="$(
            git ls-files |
              grep -E '(^|/)\.env($|\.)|^eval/(fixtures|output|runs)/' |
              grep -Ev '(^|/)\.env\.example$' || true
          )"
          if [[ -n "$tracked_sensitive" ]]; then
            echo "Sensitive or generated files must not be tracked:"
            printf '%s\n' "$tracked_sensitive"
            exit 1
          fi

      - name: Validate operations scripts
        run: bash -n ops/*.sh

      - name: Validate production Compose
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag detailer-img:ci .

      - name: Reject high-severity runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: detailer-img:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
